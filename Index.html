<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Professional client-side registration form with real-time validation using HTML, CSS and Vanilla JavaScript.">
    <meta name="theme-color" content="#0A0D12">
    <title>Form Validation System</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="Style.css">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

    <main class="page">
        <section class="hero">
            <p class="eyebrow">Client-Side Validation</p>
            <h1>Form Validation System</h1>
            <p class="hero-desc">
                Real-time registration form validation built with pure HTML, CSS and Vanilla JavaScript.
            </p>
        </section>

        <section class="card" aria-labelledby="formTitle">
            <h2 id="formTitle">Create your account</h2>

            <form id="registrationForm" novalidate>

                <div class="field">
                    <label for="fullName">Full name</label>
                    <input type="text" id="fullName" name="fullName" placeholder="Ali Mehdi" autocomplete="name"
                        maxlength="25" required aria-describedby="fullNameError" aria-invalid="false">
                    <p class="field-message" id="fullNameError" aria-live="polite"></p>
                </div>

                <div class="field">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" placeholder="ali@example.com" autocomplete="email"
                        required aria-describedby="emailError" aria-invalid="false">
                    <p class="field-message" id="emailError" aria-live="polite"></p>
                </div>

                <div class="field">
                    <label for="phone">Phone number</label>
                    <input type="tel" id="phone" name="phone" placeholder="03001234567" autocomplete="tel"
                        maxlength="11" required aria-describedby="phoneError" aria-invalid="false">
                    <p class="field-message" id="phoneError" aria-live="polite"></p>
                </div>

                <div class="field">
                    <label for="password">Password</label>

                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="Create a password"
                            autocomplete="new-password" required aria-describedby="passwordError strengthLabel"
                            aria-invalid="false">

                        <button type="button" class="password-toggle" aria-label="Show password">
                            <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
                                <circle cx="12" cy="12" r="2.5"></circle>
                            </svg>

                            <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M3 3l18 18"></path>
                                <path d="M10.6 6.2A9.8 9.8 0 0 1 12 6c6.5 0 10 6 10 6a18.7 18.7 0 0 1-3.1 3.8"></path>
                                <path d="M6.2 6.2C3.5 8.2 2 12 2 12s3.5 6 10 6c1.4 0 2.6-.3 3.7-.8"></path>
                                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
                            </svg>
                        </button>
                    </div>

                    <div class="strength" id="strengthMeter" data-level="0" hidden>
                        <div class="strength-track" aria-hidden="true">
                            <span class="seg"></span>
                            <span class="seg"></span>
                            <span class="seg"></span>
                            <span class="seg"></span>
                        </div>
                        <span class="strength-label" id="strengthLabel"></span>
                    </div>

                    <p class="field-message" id="passwordError" aria-live="polite"></p>
                </div>

                <div class="field">
                    <label for="confirmPassword">Confirm password</label>

                    <div class="password-wrapper">
                        <input type="password" id="confirmPassword" name="confirmPassword"
                            placeholder="Repeat your password" autocomplete="new-password" required
                            aria-describedby="confirmPasswordError" aria-invalid="false">

                        <button type="button" class="password-toggle" aria-label="Show password">
                            <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
                                <circle cx="12" cy="12" r="2.5"></circle>
                            </svg>

                            <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M3 3l18 18"></path>
                                <path d="M10.6 6.2A9.8 9.8 0 0 1 12 6c6.5 0 10 6 10 6a18.7 18.7 0 0 1-3.1 3.8"></path>
                                <path d="M6.2 6.2C3.5 8.2 2 12 2 12s3.5 6 10 6c1.4 0 2.6-.3 3.7-.8"></path>
                                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
                            </svg>
                        </button>
                    </div>

                    <p class="field-message" id="confirmPasswordError" aria-live="polite"></p>
                </div>

                <div class="field field-checkbox"> <label class="checkbox-label" for="terms"> <input type="checkbox"
                            id="terms" name="terms" required aria-describedby="termsError" aria-invalid="false"> <span>I
                            agree to the Terms of Service and Privacy Policy</span> </label>
                    <p class="field-message" id="termsError" aria-live="polite"></p>
                </div>

                <button type="submit" class="submit-btn">
                    Create Account
                </button>
            </form>
        </section>
    </main>

    <script src="Script.js"></script>
</body>

</html>
